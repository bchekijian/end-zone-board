<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>End Zone Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f2;--surface:#fff;--line:#d3d9d0;--fg:#18201b;--muted:#5d6a61;--accent:#b07a00;--bad:#b23a2e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1411;--surface:#171e19;--line:#2c372f;--fg:#e7ece8;--muted:#93a198;--accent:#e8b53a;--bad:#f08a7c;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:grid;gap:14px}
h1{margin:0;font:700 2.3rem/0.9 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase}
h1 span{color:var(--accent)}
p{margin:0;color:var(--muted);font-size:.9rem}
label{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
.row{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
button{border:0;border-radius:8px;padding:11px;background:var(--fg);color:var(--bg);font:600 1rem inherit;font-family:inherit;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1>End Zone <span>Board</span></h1>
  <p>Private NFL anytime touchdown picks. Enter the password to open.</p>
  <input type="text" name="username" value="endzoneboard" autocomplete="username" hidden>
  <div style="display:grid;gap:6px"><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required autofocus></div>
  <label class="row" style="text-transform:none;letter-spacing:0;font-weight:400"><input type="checkbox" id="remember"> Stay unlocked on this device</label>
  <button id="go" type="submit">Open board</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
const P=/*PAYLOAD*/null;
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openBoard(pw){
  const S=crypto.subtle,K=P.keys;
  const base=await S.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await S.deriveKey({name:'PBKDF2',salt:u8(K.salt),iterations:K.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pkcs8=await S.decrypt({name:'AES-GCM',iv:u8(K.iv)},k,u8(K.priv));
  const priv=await S.importKey('pkcs8',pkcs8,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
  const raw=await S.decrypt({name:'RSA-OAEP'},priv,u8(P.wk));
  const ak=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const html=new TextDecoder().decode(await S.decrypt({name:'AES-GCM',iv:u8(P.iv)},ak,u8(P.ct)));
  return html;
}
function show(html){document.open();document.write(html);document.close();}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Unlocking…';
  const pw=document.getElementById('pw').value;
  try{const html=await openBoard(pw);
    try{if(document.getElementById('remember').checked)localStorage.setItem('ezb-pw',pw);else localStorage.removeItem('ezb-pw')}catch(_){}
    show(html);
  }catch(_){err.textContent='That password didn’t work. Check it and try again.';go.disabled=false;go.textContent='Open board';}
});
(async()=>{let pw=null;try{pw=localStorage.getItem('ezb-pw')}catch(_){}
  if(pw){try{show(await openBoard(pw))}catch(_){try{localStorage.removeItem('ezb-pw')}catch(__){}}}})();
</script>
</body>
</html>
